name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Oracle JDK 25 is the first freely available build with the eMudhra CA
      # fix (25.0.5.0.2); Temurin hasn't shipped one yet. The bytecode target
      # stays Java 17 via maven.compiler.release in the root pom.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      - name: Build and test
        run: mvn --no-transfer-progress verify
